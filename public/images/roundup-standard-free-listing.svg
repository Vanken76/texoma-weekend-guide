<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1260" role="img" aria-labelledby="title desc">
  <title id="title">Texoma Weekend Guide standard free roundup listing</title>
  <desc id="desc">Saturday September 5 roundup showing Derryl Perry as a standard free text listing among other events.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6e8"/>
