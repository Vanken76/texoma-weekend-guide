name: Fix state RDATE filter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix invalid RegExp filter callback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/states/[slug].astro')
          text = path.read_text()
          old = '.filter(/^\\d{8}$/)'
          new = '.filter((entry) => /^\\d{8}$/.test(entry))'
          count = text.count(old)
          assert count == 1, f'expected one invalid RDATE filter, found {count}'
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-state-rdates-filter.yml
          git add 'src/pages/states/[slug].astro'
          git commit -m "Fix state RDATE recurrence filter"
          git push origin main
