name: Site QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Grayson event count diagnostic
        run: node scripts/debug-grayson-event-count.mjs

      - name: Run production build
        run: npm run build

      - name: Verify search discovery output
        run: |
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -q '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' dist/sitemap.xml
          grep -q '<loc>https://texomaweekendguide.com/</loc>' dist/sitemap.xml
          grep -q 'Sitemap: https://texomaweekendguide.com/sitemap.xml' dist/robots.txt
          if grep -q '<loc>https://texomaweekendguide.com/admin' dist/sitemap.xml; then
            echo 'Admin URL found in sitemap.'
            exit 1
          fi
