name: Site QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture Step 14 JSON-LD warning inventory
        if: github.event_name == 'pull_request' && github.head_ref == 'step14-targeted-cleanup-2026-08-19'
        run: node scripts/check-jsonld.mjs > /tmp/step14-qa-report.txt

      - name: Post Step 14 warning inventory to PR
        if: github.event_name == 'pull_request' && github.head_ref == 'step14-targeted-cleanup-2026-08-19'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/step14-qa-report.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Step 14 JSON-LD QA inventory\n\n\`\`\`text\n${report}\n\`\`\``
            });

      - name: Run production build
        run: npm run build

      - name: Verify search discovery output
        run: |
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -q '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' dist/sitemap.xml
          grep -q '<loc>https://texomaweekendguide.com/</loc>' dist/sitemap.xml
          grep -q 'Sitemap: https://texomaweekendguide.com/sitemap.xml' dist/robots.txt
          if grep -q '<loc>https://texomaweekendguide.com/admin' dist/sitemap.xml; then
            echo 'Admin URL found in sitemap.'
            exit 1
          fi
