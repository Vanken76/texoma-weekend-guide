name: TWG one-time stale event cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale duplicate event and recalculate counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('public/data/local-event-directory.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          stale = 'open-mic-with-danny-k-at-sloppy-joes-july-30-2026'
          keep = 'open-mic-with-danny-k-at-sloppy-joes-2026-07-30'

          before = len(data['events'])
          data['events'] = [e for e in data['events'] if e.get('event_slug') != stale]
          removed = before - len(data['events'])
          if removed != 1:
              raise SystemExit(f'Expected to remove exactly 1 stale event, removed {removed}')

          if not any(e.get('event_slug') == keep for e in data['events']):
              raise SystemExit('Canonical Danny K event is missing; refusing to commit')

          data['event_count'] = len(data['events'])
          data['publish_ready_count'] = sum(e.get('publish_ready') is True for e in data['events'])

          if data['event_count'] != 161 or data['publish_ready_count'] != 161:
              raise SystemExit(f"Unexpected counts after cleanup: {data['event_count']} / {data['publish_ready_count']}")

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/twg-one-time-remove-stale-open-mic.yml

      - name: Commit cleanup
        run: |
          git config user.name "TWG Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/local-event-directory.json .github/workflows/twg-one-time-remove-stale-open-mic.yml
          git commit -m "Remove stale duplicate Danny K open mic event"
          git push
