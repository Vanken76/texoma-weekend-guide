name: Fix Forest Park event venue slug

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/forest-park-slug-fix-trigger.txt

permissions:
  contents: write

jobs:
  fix-slug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Correct only the Ray Wylie Hubbard venue slug
        shell: python
        run: |
          from pathlib import Path

          path = Path("public/data/local-event-directory.json")
          text = path.read_text(encoding="utf-8")
          event_marker = '"event_slug": "music-on-main-ray-wylie-hubbard-2026-07-31"'
          old_slug = '"venue_slug": "forest-park"'
          new_slug = '"venue_slug": "forest-park-denison"'

          event_start = text.find(event_marker)
          if event_start == -1:
              raise SystemExit("Target event was not found; no changes made.")

          next_event = text.find('"event_slug":', event_start + len(event_marker))
          event_end = next_event if next_event != -1 else len(text)
          event_block = text[event_start:event_end]

          if event_block.count(old_slug) != 1:
              raise SystemExit("Expected exactly one old venue slug in the target event; no changes made.")

          corrected_block = event_block.replace(old_slug, new_slug, 1)
          corrected = text[:event_start] + corrected_block + text[event_end:]
          path.write_text(corrected, encoding="utf-8")

      - name: Remove temporary files and commit correction
        run: |
          rm .github/workflows/fix-forest-park-event-slug.yml
          rm .github/forest-park-slug-fix-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/local-event-directory.json .github/workflows/fix-forest-park-event-slug.yml .github/forest-park-slug-fix-trigger.txt
          git commit -m "Fix Forest Park venue slug for Ray Wylie Hubbard event"
          git push origin HEAD:${{ github.head_ref }}
