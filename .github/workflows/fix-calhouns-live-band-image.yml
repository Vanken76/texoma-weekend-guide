name: Fix Calhoun's live-band gallery image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-calhouns-live-band-image.yml

permissions:
  contents: write

jobs:
  fix-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild verified live-band image
        run: |
          set -euo pipefail
          cat .github/tmp/liveband-fix/part00 .github/tmp/liveband-fix/part01 .github/tmp/liveband-fix/part02 .github/tmp/liveband-fix/part03 .github/tmp/liveband-fix/part04 .github/tmp/liveband-fix/part05 | base64 -d > /tmp/live-band-stage.jpg
          test "$(stat -c%s /tmp/live-band-stage.jpg)" = "16553"
          file /tmp/live-band-stage.jpg | grep -q 'JPEG image data'
          cp /tmp/live-band-stage.jpg public/images/businesses/calhouns-2-0/live-band-stage.jpg

      - name: Remove temporary installer files
        run: |
          rm -rf .github/tmp/liveband-fix
          rm .github/workflows/fix-calhouns-live-band-image.yml

      - name: Commit repaired gallery image
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Calhoun's live-band gallery image"
          git push
