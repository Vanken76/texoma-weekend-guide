name: Diagnose business count

on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count source records
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('public/data/local-business-directory.json','utf8'));const a=d.businesses||[];const p=a.filter(b=>b.publish_ready===true);const counts={};for(const b of p){counts[b.slug]=(counts[b.slug]||0)+1}const dup=Object.entries(counts).filter(([,n])=>n>1);console.log('TOTAL_RECORDS='+a.length);console.log('PUBLISH_READY='+p.length);console.log('METADATA_PUBLISH_READY='+d.publish_ready_count);console.log('AMONG_THE_PAGES='+JSON.stringify(p.filter(b=>b.slug==='among-the-pages').map(b=>({name:b.business_name,slug:b.slug,publish_ready:b.publish_ready,state:b.state,location:b.service_area_or_location}))));console.log('DUPLICATE_PUBLISHED_SLUGS='+JSON.stringify(dup));"
      - name: Install dependencies
        run: npm clean-install --progress=false
      - name: Build site
        run: npm run build
      - name: Inspect built business directory
        run: node -e "const fs=require('fs');const h=fs.readFileSync('dist/businesses/index.html','utf8');const headline=h.match(/Search and filter\s*(\d+)\s*completed local business listings/i);const cards=(h.match(/class=\"business-card/g)||[]).length;console.log('BUILT_HEADLINE='+(headline?headline[1]:'NOT_FOUND'));console.log('BUILT_BUSINESS_CARDS='+cards);"
