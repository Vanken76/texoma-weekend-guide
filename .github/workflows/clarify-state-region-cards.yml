name: Clarify state geography cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Name linked regions and destinations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/states/[slug].astro')
          text = path.read_text()

          old = 'const titleCase = (value) => String(value || "").replaceAll("_", " ").replace(/\\b\\w/g, (letter) => letter.toUpperCase());'
          new = old + '\nconst geographyLabel = (value) => titleCase(String(value || "").replaceAll("-", " "));'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '<div class="stat-card"><strong>{entity.region_slugs?.length || 0}</strong><span>linked regions</span></div>'
          new = '<div class="stat-card geography-stat"><strong>{(entity.region_slugs ?? []).map(geographyLabel).join(" · ") || "None"}</strong><span>TWG coverage regions</span></div>'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '<div class="stat-card"><strong>{entity.related_geography_slugs?.length || 0}</strong><span>related destinations</span></div>'
          new = '<div class="stat-card geography-stat"><strong>{(entity.related_geography_slugs ?? []).map(geographyLabel).join(" · ") || "None"}</strong><span>related destinations</span></div>'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '.stat-card strong{font-size:2.2rem;line-height:1}.stat-card span{color:#d6edf2;font-weight:750}'
          new = '.stat-card strong{font-size:2.2rem;line-height:1}.geography-stat strong{font-size:1.35rem;line-height:1.2}.stat-card span{color:#d6edf2;font-weight:750}'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify production build
        run: |
          npm clean-install --progress=false
          npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clarify-state-region-cards.yml
          git add 'src/pages/states/[slug].astro'
          git commit -m "Clarify state region and destination cards"
          git push origin main
