name: Link Lake Texoma state card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Link related destination when matching business exists
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/states/[slug].astro')
          text = path.read_text()
          old = 'const businessHref = `/businesses/?state=${encodeURIComponent(String(entity.abbreviation || entity.name || entity.slug).toLowerCase())}`;'
          new = old + '\nconst relatedDestinationSlugs = entity.related_geography_slugs ?? [];\nconst relatedDestinationHref = relatedDestinationSlugs.length === 1 && businessSlugs.has(relatedDestinationSlugs[0])\n  ? `/businesses/${relatedDestinationSlugs[0]}/`\n  : null;'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '          <div class="stat-card geography-stat"><strong>{(entity.related_geography_slugs ?? []).map(geographyLabel).join(" · ") || "None"}</strong><span>related destinations</span></div>'
          new = '          {relatedDestinationHref ? (\n            <a class="stat-card geography-stat" href={relatedDestinationHref}><strong>{relatedDestinationSlugs.map(geographyLabel).join(" · ") || "None"}</strong><span>related destination</span></a>\n          ) : (\n            <div class="stat-card geography-stat"><strong>{relatedDestinationSlugs.map(geographyLabel).join(" · ") || "None"}</strong><span>related destinations</span></div>\n          )}'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify production build
        run: |
          npm clean-install --progress=false
          npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/link-lake-texoma-state-card.yml
          git add 'src/pages/states/[slug].astro'
          git commit -m "Link Lake Texoma from Texas state page"
          git push origin main
