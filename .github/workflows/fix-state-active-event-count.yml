name: Fix state active event count

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make state event count match active event directory
        run: |
          python - <<'PY'
          from pathlib import Path

          state_path = Path('src/pages/states/[slug].astro')
          events_path = Path('src/pages/events.astro')
          state = state_path.read_text()
          event_page = events_path.read_text()

          start_marker = 'const events = (eventDirectory.events ?? []).filter((event) => {'
          end_marker = '\n});\n\nconst symbolEntries'
          start = state.index(start_marker)
          end = state.index(end_marker, start)
          state_block = state[start:end + len('\n});')]
          state_block = state_block.replace('const events =', 'const stateEvents =', 1)

          helper_start = event_page.index('const isRecurring = (event) =>')
          helper_end = event_page.index('const formatDate =', helper_start)
          helpers = event_page[helper_start:helper_end]

          date_setup = '\n'.join([
            'const now = new Date();',
            'const chicagoDate = (date = new Date()) => new Intl.DateTimeFormat("en-CA", {',
            '  timeZone: "America/Chicago",',
            '  year: "numeric",',
            '  month: "2-digit",',
            '  day: "2-digit"',
            '}).format(date);',
            'const today = chicagoDate(now);',
            ''
          ])
          active_events = '\n'.join([
            'const events = stateEvents',
            '  .filter((event) => ["upcoming", "recurring"].includes(event.status))',
            '  .filter(isCurrent);',
            ''
          ])

          replacement = state_block + '\n\n' + date_setup + helpers + active_events
          state = state[:start] + replacement + state[end + len('\n});'):]
          state_path.write_text(state)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-state-active-event-count.yml
          git add 'src/pages/states/[slug].astro'
          git commit -m "Count only active events on state pages"
          git push origin main
