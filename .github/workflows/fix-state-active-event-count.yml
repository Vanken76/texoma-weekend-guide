name: Fix state active event count

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make state event count match active event directory
        env:
          OLD_BLOCK_B64: 
          NEW_BLOCK_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('src/pages/states/[slug].astro')
          text = path.read_text()
          old = base64.b64decode(os.environ['OLD_BLOCK_B64']).decode()
          new = base64.b64decode(os.environ['NEW_BLOCK_B64']).decode()
          assert text.count(old) == 1, f'event count block target count: {text.count(old)}'
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Vanken76@users.noreply.github.com"
          git rm .github/workflows/fix-state-active-event-count.yml
          git add 'src/pages/states/[slug].astro'
          git commit -m "Count only active events on state pages"
          git push origin main
