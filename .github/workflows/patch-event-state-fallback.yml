name: Patch event state fallback

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-event-state-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch events directory and diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path

          events_path = Path("src/pages/events.astro")
          text = events_path.read_text()

          old_import = 'import businessDirectory from "../../public/data/local-business-directory.json";\n'
          new_import = old_import + 'import { businessStateCode } from "../utils/businessState.js";\n'
          if 'import { businessStateCode } from "../utils/businessState.js";' not in text:
              if old_import not in text:
                  raise SystemExit("Expected events.astro import anchor not found")
              text = text.replace(old_import, new_import, 1)

          old_anchor = 'const getPrimaryVenueSlug = (event) => getVenueSlugs(event)[0] ?? null;\n'
          state_helper = '''const eventStateCode = (event = {}) => {\n  const directState = businessStateCode(event);\n  if (directState) return directState;\n  for (const slug of getVenueSlugs(event)) {\n    const venueState = businessStateCode(businessBySlug.get(slug) ?? {});\n    if (venueState) return venueState;\n  }\n  return "";\n};\n'''
          if 'const eventStateCode = (event = {}) =>' not in text:
              if old_anchor not in text:
                  raise SystemExit("Expected events.astro venue anchor not found")
              text = text.replace(old_anchor, old_anchor + state_helper, 1)

          old_fallback = '''const withVenueFallbacks = (event) => {\n  const venueSlug = getPrimaryVenueSlug(event);\n  const business = venueSlug ? businessBySlug.get(venueSlug) : null;\n  return {\n    ...event,\n    venue_name: event.venue_name || event.location_name || business?.business_name || "",\n    address: event.address || business?.address || null,\n    city: event.city || business?.city || "",\n    state: event.state || business?.state || "",\n    postal_code: event.postal_code || business?.postal_code || null\n  };\n};'''
          new_fallback = '''const withVenueFallbacks = (event) => {\n  const venueSlug = getPrimaryVenueSlug(event);\n  const business = venueSlug ? businessBySlug.get(venueSlug) : null;\n  const resolvedState = eventStateCode(event);\n  return {\n    ...event,\n    venue_name: event.venue_name || event.location_name || business?.business_name || "",\n    address: event.address || business?.address || null,\n    city: event.city || business?.city || "",\n    state: event.state || business?.state || (resolvedState ? resolvedState.toUpperCase() : ""),\n    postal_code: event.postal_code || business?.postal_code || null\n  };\n};'''
          if old_fallback in text:
              text = text.replace(old_fallback, new_fallback, 1)
          elif new_fallback not in text:
              raise SystemExit("Expected events.astro fallback block not found")

          events_path.write_text(text)

          diagnostic_path = Path("scripts/debug-grayson-event-count.mjs")
          diagnostic = diagnostic_path.read_text()
          diagnostic_anchor = '''const directoryEventCityValues = (event = {}) => {\n  const directValues = [\n    event.city_slug,\n    event.city,\n    cityFromLocationText(event.address),\n    cityFromLocationText(event.full_address),\n    cityFromLocationText(event.formatted_address),\n    cityFromLocationText(event.location),\n    ...toArray(event.related_geography_slugs),\n    ...toArray(event.geography_slugs),\n    ...toArray(event.tags)\n  ].map(normalizeCity).filter(Boolean);\n  const venueValues = directoryGetVenueSlugs(event)\n    .flatMap((slug) => directoryBusinessCityValues(directoryBusinessesBySlug.get(slug) ?? {}));\n  return [...new Set([...directValues, ...venueValues])];\n};\n'''
          diagnostic_helper = '''const directoryEventStateCode = (event = {}) => {\n  const directState = businessStateCode(event);\n  if (directState) return directState;\n  for (const slug of directoryGetVenueSlugs(event)) {\n    const venueState = businessStateCode(directoryBusinessesBySlug.get(slug) ?? {});\n    if (venueState) return venueState;\n  }\n  return "";\n};\n'''
          if 'const directoryEventStateCode = (event = {}) =>' not in diagnostic:
              if diagnostic_anchor not in diagnostic:
                  raise SystemExit("Expected diagnostic city helper anchor not found")
              diagnostic = diagnostic.replace(diagnostic_anchor, diagnostic_anchor + diagnostic_helper, 1)

          diagnostic_old = '''const directoryWithVenueFallbacks = (event) => {\n  const venueSlug = directoryPrimaryVenueSlug(event);\n  const business = venueSlug ? directoryBusinessesBySlug.get(venueSlug) : null;\n  return {\n    ...event,\n    venue_name: event.venue_name || event.location_name || business?.business_name || "",\n    address: event.address || business?.address || null,\n    city: event.city || business?.city || "",\n    state: event.state || business?.state || "",\n    postal_code: event.postal_code || business?.postal_code || null\n  };\n};'''
          diagnostic_new = '''const directoryWithVenueFallbacks = (event) => {\n  const venueSlug = directoryPrimaryVenueSlug(event);\n  const business = venueSlug ? directoryBusinessesBySlug.get(venueSlug) : null;\n  const resolvedState = directoryEventStateCode(event);\n  return {\n    ...event,\n    venue_name: event.venue_name || event.location_name || business?.business_name || "",\n    address: event.address || business?.address || null,\n    city: event.city || business?.city || "",\n    state: event.state || business?.state || (resolvedState ? resolvedState.toUpperCase() : ""),\n    postal_code: event.postal_code || business?.postal_code || null\n  };\n};'''
          if diagnostic_old in diagnostic:
              diagnostic = diagnostic.replace(diagnostic_old, diagnostic_new, 1)
          elif diagnostic_new not in diagnostic:
              raise SystemExit("Expected diagnostic fallback block not found")

          diagnostic_path.write_text(diagnostic)
          PY

      - name: Check patch
        run: git diff --check

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run diagnostic
        run: node scripts/debug-grayson-event-count.mjs

      - name: Run production build
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/events.astro scripts/debug-grayson-event-count.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Align event state fallback with venue geography"
          git push
