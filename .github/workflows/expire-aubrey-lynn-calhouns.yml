name: Expire Aubrey Lynn Calhoun's event

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/expire-aubrey-lynn-calhouns.yml

permissions:
  contents: write

jobs:
  expire-event:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark past Aubrey Lynn event ended
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('public/data/local-event-directory.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          slug = 'aubrey-lynn-live-at-calhouns-2-0-denison-2026-08-01'
          event = next((e for e in data.get('events', []) if e.get('event_slug') == slug), None)
          if event is None:
              raise SystemExit('Aubrey Lynn event record not found')

          event['status'] = 'ended'
          event['updated_on'] = '2026-08-07'
          note = event.get('verification_note') or ''
          addition = ' Marked ended on August 7, 2026 after its scheduled August 2, 2026 2:00 AM end time passed.'
          if addition.strip() not in note:
              event['verification_note'] = note.rstrip() + addition

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/expire-aubrey-lynn-calhouns.yml

      - name: Commit expiration fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/local-event-directory.json .github/workflows/expire-aubrey-lynn-calhouns.yml
          git commit -m "Expire past Aubrey Lynn Calhoun's event"
          git push
