name: Fix Texas business links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Texas business links and directory state filter
        run: |
          python - <<'PY'
          from pathlib import Path

          state_path = Path('src/pages/states/[slug].astro')
          state = state_path.read_text()
          target = 'const eventHref = `/events/?state=${encodeURIComponent(String(entity.abbreviation || entity.name || entity.slug).toLowerCase())}`;'
          replacement = target + '\nconst businessHref = `/businesses/?state=${encodeURIComponent(String(entity.abbreviation || entity.name || entity.slug).toLowerCase())}`;'
          assert state.count(target) == 1
          state = state.replace(target, replacement, 1)
          assert state.count('href="/directory/"') == 2
          state = state.replace('href="/directory/"', 'href={businessHref}', 2)
          state_path.write_text(state)

          path = Path('src/pages/businesses.astro')
          text = path.read_text()

          old = 'const locations = [...new Set(businesses.map((business) => business.service_area_or_location).filter(Boolean))]\n  .sort((a, b) => a.localeCompare(b));'
          new = old + '\nconst states = [["tx", "Texas"], ["ok", "Oklahoma"]];'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '<label><span>Location</span><select id="location-filter"><option value="">All locations</option>{locations.map((location) => <option value={location.toLowerCase()}>{location}</option>)}</select></label>\n      <label><span>Sort</span><select id="sort-filter"><option value="az">Name: A–Z</option><option value="za">Name: Z–A</option></select></label>'
          new = '<label><span>Location</span><select id="location-filter"><option value="">All locations</option>{locations.map((location) => <option value={location.toLowerCase()}>{location}</option>)}</select></label>\n      <label><span>State</span><select id="state-filter"><option value="">All states</option>{states.map(([value, label]) => <option value={value}>{label}</option>)}</select></label>\n      <label><span>Sort</span><select id="sort-filter"><option value="az">Name: A–Z</option><option value="za">Name: Z–A</option></select></label>'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = 'data-location={(business.service_area_or_location ?? "").toLowerCase()}\n          data-categories={business.category.join("|").toLowerCase()}'
          new = 'data-location={(business.service_area_or_location ?? "").toLowerCase()}\n          data-state={String(business.state_abbreviation || business.state || business.state_name || business.state_slug || "").toLowerCase()}\n          data-categories={business.category.join("|").toLowerCase()}'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '    const locationFilter = document.querySelector("#location-filter");\n    const sortFilter = document.querySelector("#sort-filter");'
          new = '    const locationFilter = document.querySelector("#location-filter");\n    const stateFilter = document.querySelector("#state-filter");\n    const sortFilter = document.querySelector("#sort-filter");'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '    const cards = Array.from(document.querySelectorAll(".business-card"));\n\n    function updateDirectory() {'
          lines = [
            '    const cards = Array.from(document.querySelectorAll(".business-card"));',
            '    const normalizeState = (value = "") => {',
            '      const state = String(value ?? "").trim().toLowerCase();',
            '      if (state === "texas") return "tx";',
            '      if (state === "oklahoma") return "ok";',
            '      return state;',
            '    };',
            '    const requestedState = normalizeState(new URLSearchParams(window.location.search).get("state") ?? "");',
            '    if (stateFilter && ["tx", "ok"].includes(requestedState)) stateFilter.value = requestedState;',
            '',
            '    function updateDirectory() {'
          ]
          new = '\n'.join(lines)
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '      const locationValue = locationFilter.value;\n      const sortValue = sortFilter.value;'
          new = '      const locationValue = locationFilter.value;\n      const stateValue = stateFilter?.value ?? "";\n      const sortValue = sortFilter.value;'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '          (!categoryValue || card.dataset.categories.split("|").includes(categoryValue)) &&\n          (!locationValue || card.dataset.location === locationValue);'
          new = '          (!categoryValue || card.dataset.categories.split("|").includes(categoryValue)) &&\n          (!locationValue || card.dataset.location === locationValue) &&\n          (!stateValue || normalizeState(card.dataset.state ?? "") === stateValue);'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '    locationFilter.addEventListener("change", updateDirectory);\n    sortFilter.addEventListener("change", updateDirectory);'
          new = '    locationFilter.addEventListener("change", updateDirectory);\n    stateFilter?.addEventListener("change", updateDirectory);\n    sortFilter.addEventListener("change", updateDirectory);'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '      locationFilter.value = "";\n      sortFilter.value = "az";\n      updateDirectory();'
          new = '      locationFilter.value = "";\n      if (stateFilter) stateFilter.value = "";\n      sortFilter.value = "az";\n      history.replaceState({}, "", window.location.pathname);\n      updateDirectory();'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '    clearButton.addEventListener("click", () => {'
          new = '    updateDirectory();\n\n    clearButton.addEventListener("click", () => {'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '.controls{display:grid;grid-template-columns:minmax(240px,2fr) repeat(3,minmax(180px,1fr)) auto;'
          new = '.controls{display:grid;grid-template-columns:minmax(240px,2fr) repeat(4,minmax(160px,1fr)) auto;'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify production build
        run: |
          npm clean-install --progress=false
          npm run build

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-state-business-links.yml
          git add src/pages/businesses.astro 'src/pages/states/[slug].astro'
          git commit -m "Fix Texas business directory links and state filter"
          git push origin main
