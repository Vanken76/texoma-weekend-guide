name: Restore Salty Heifer logo pointer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-salty-heifer-logo.yml

permissions:
  contents: write

jobs:
  restore-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Salty Heifer logo URL
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/data/local-business-directory.json')
          text = path.read_text(encoding='utf-8')
          anchor = '"slug": "the-salty-heifer-cafe-denison"'
          start = text.find(anchor)
          if start < 0:
              raise SystemExit('Salty Heifer business record not found')

          next_slug = text.find('"slug": "', start + len(anchor))
          end = next_slug if next_slug >= 0 else len(text)
          segment = text[start:end]

          target = '"logo_url": "/images/businesses/the-salty-heifer-cafe-denison-logo.jpg"'
          old = '"logo_url": null'

          if target in segment:
              print('Logo pointer is already restored.')
          elif old in segment:
              segment = segment.replace(old, target, 1)
              text = text[:start] + segment + text[end:]
              path.write_text(text, encoding='utf-8')
              print('Restored Salty Heifer logo pointer.')
          else:
              raise SystemExit('Expected null logo_url was not found in Salty Heifer record')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/restore-salty-heifer-logo.yml

      - name: Commit restored pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/local-business-directory.json .github/workflows/restore-salty-heifer-logo.yml
          git commit -m "Restore Salty Heifer logo pointer"
          git push
