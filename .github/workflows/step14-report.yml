name: Step 14 Warning Inventory

on:
  push:
    branches:
      - step14-targeted-cleanup-2026-08-19

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture JSON-LD QA inventory
        run: node scripts/check-jsonld.mjs > docs/step14-qa-report.txt
      - name: Commit inventory report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/step14-qa-report.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Step 14 QA warning inventory"
          git push
